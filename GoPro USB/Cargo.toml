[package]
name = "gopro-usb"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = "debuginfo"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
libloading = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
tray-icon = { version = "0.26.1", default-features = false }
wry = "0.57.2"
zeromq = "0.7.0"

[build-dependencies]
cc = "1.11.2"
winresource = "0.1.34"
